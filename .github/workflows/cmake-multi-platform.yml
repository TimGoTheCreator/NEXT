name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, windows-2022, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-2022
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: windows-2022
            c_compiler: clang
          - os: ubuntu-22.04
            c_compiler: cl
          - os: ubuntu-24.04
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # CACHE: APT (Linux)
      # ---------------------------------------------------------
      - name: Cache APT packages
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: apt-${{ matrix.os }}-

      # ---------------------------------------------------------
      # CACHE: Homebrew (macOS)
      # ---------------------------------------------------------
      - name: Cache Homebrew
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
            /opt/homebrew
          key: brew-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: brew-${{ matrix.os }}-

      # ---------------------------------------------------------
      # CACHE: vcpkg (Windows MSVC)
      # ---------------------------------------------------------
      - name: Cache vcpkg
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'cl'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ matrix.os }}-


      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: Install OpenMP + HDF5 (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev libhdf5-dev

      - name: Install OpenMP + HDF5 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install llvm libomp hdf5

      - name: Install MinGW + HDF5 (Windows GCC)
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'gcc'
        shell: bash
        run: |
          choco install msys2 -y || true
          if [ -f "C:/tools/msys64/usr/bin/pacman" ]; then
            C:/tools/msys64/usr/bin/pacman -Syu --noconfirm
            C:/tools/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-hdf5
          elif [ -f "C:/msys64/usr/bin/pacman" ]; then
            C:/msys64/usr/bin/pacman -Syu --noconfirm
            C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-x86_64-hdf5
          fi

      - name: Set up MSVC environment
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg + HDF5 (Windows MSVC)
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'cl'
        shell: powershell
        run: |
          vcpkg install hdf5[hl]:x64-windows

      # ---------------------------------------------------------
      # Set build directory
      # ---------------------------------------------------------
      - name: Set reusable strings
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Configure CMake
      # ---------------------------------------------------------
      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang
          -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/llvm;/opt/homebrew/opt/hdf5"

      - name: Configure CMake (Windows MinGW)
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'gcc'
        shell: bash
        run: |
          cmake -G "MinGW Makefiles" \
            -B "${{ github.workspace }}/build" \
            -S "${{ github.workspace }}" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Windows MSVC)
        if: (matrix.os == 'windows-latest' || matrix.os == 'windows-2022') && matrix.c_compiler == 'cl'
        shell: powershell
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -S ${{ github.workspace }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure CMake (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -S ${{ github.workspace }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      # ---------------------------------------------------------
      # Test
      # ---------------------------------------------------------
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

      # ---------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: next-bin-${{ runner.os }}-${{ matrix.c_compiler }}
          path: |
            ${{ steps.strings.outputs.build-output-dir }}/next
            ${{ steps.strings.outputs.build-output-dir }}/next.exe